; PHP overrides for the production container.
;
; The local counterpart is docker/php-local.ini; keep them recognisably similar
; so a "works locally, not in production" question has a short list of suspects.

; WooCommerce product images and CSV imports both need headroom, and the admin
; media library is the usual thing to hit this.
upload_max_filesize = 128M
post_max_size = 128M

; DELIBERATELY BELOW what one request would need to breach the container's
; 640 MB mem_limit. A runaway request therefore dies with a PHP fatal that lands
; in the log, instead of the cgroup OOM-killing Apache with nothing to read
; afterwards. Raising this without raising mem_limit trades a visible failure
; for an invisible one.
memory_limit = 256M

; Long enough for a WooCommerce admin report over ~6,900 products, short enough
; that a stuck request gives its worker back -- and there are only five.
max_execution_time = 120

; WooCommerce bulk-edit and variation screens post large forms; the default 1000
; silently truncates them, which looks like data loss rather than a limit.
max_input_vars = 5000

display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Opcache. One shared 96 MB segment for all five workers, sized to fit the
; container limit alongside them -- see docker-compose.prod.yml for the
; arithmetic. WordPress plus WooCommerce plus Blocksy is comfortably over 10,000
; files, and the stock 10,000 max_accelerated_files would thrash.
opcache.enable = 1
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 20000

; Timestamps ARE validated, at 60-second granularity. Turning validation off is
; the faster setting and the wrong one here: the webroot is a bind mount that
; gets updated in place, so stale-cached files would survive a deploy and the
; symptom would be code that demonstrably changed on disk having no effect.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
