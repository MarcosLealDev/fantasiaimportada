# Recover the real client IP behind Caddy.
#
# The chain is: visitor -> Cloudflare -> Caddy -> this Apache. Caddy resolves
# the visitor's address from CF-Connecting-IP (only for peers inside
# Cloudflare's published ranges, so it cannot be forged) and passes it on as
# both X-Forwarded-For and X-Real-IP, having first stripped the spoofable
# CF-Connecting-IP / Incap-Client-IP / X-Sucuri-ClientIP / True-Client-IP
# headers from the inbound request.
#
# X-Real-IP rather than X-Forwarded-For, matching the neighbouring stores:
# X-Forwarded-For is a LIST that anything upstream may append to, so reading it
# means deciding which element to trust. X-Real-IP is a single value that Caddy
# always overwrites.
RemoteIPHeader X-Real-IP

# RemoteIPInternalProxy, NOT RemoteIPTrustedProxy. The latter silently DECLINES
# to trust private addresses, which means it works in production and fails in
# any environment where the proxy is on a private bridge -- exactly the trap
# documented in the bellacollezione repo.
#
# The whole of 172.16.0.0/12 rather than the current 172.18.0.0/16 bridge: the
# range is private and only reachable from inside Docker, and pinning the exact
# subnet means this silently stops working the day the bridge is renumbered.
RemoteIPInternalProxy 172.16.0.0/12

# Redefine `combined` rather than adding a CustomLog. The base image's vhost
# already logs with that nickname to stdout, so a second CustomLog here would
# log every request TWICE. Redefining the format works because conf-enabled is
# included before sites-enabled.
#
# %a is the address after mod_remoteip has rewritten it (the visitor);
# %{c}a is the actual peer (Caddy). Keeping both means a "the real IP is wrong"
# question can be answered from the log itself rather than by guessing, which is
# the same reason the bellacollezione access log carries both.
LogFormat "%a %{c}a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
