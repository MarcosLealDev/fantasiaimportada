# Worker limits, sized for a SHARED 1 vCPU / 2 GB droplet.
#
# The stock MaxRequestWorkers of 150 is the single most dangerous default in
# this stack. mod_php means every worker holds a PHP interpreter, and a
# WooCommerce page with a 6,900-product catalog is not a cheap one -- 150 of
# them would exhaust the droplet's memory long before the CPU ever saturated,
# and the kernel OOM killer would then pick a victim by badness score rather
# than by fault. The likely victim is the SHARED MariaDB, which would take all
# three sites down.
#
# Five workers is a deliberate choice about the box, not about this site's
# traffic. On one vCPU, requests beyond a handful do not run in parallel in any
# useful sense -- they queue either way. Queueing in Apache's accept backlog is
# cheap; queueing as five more resident PHP interpreters is not.
#
# ServerLimit must be raised alongside MaxRequestWorkers to go above 5 -- prefork
# caps the latter at the former, silently.
#
# THIS IS THE FIRST DIAL TO TURN if the droplet struggles, in either direction:
# lower it to give the neighbours room, and see docker-compose.prod.yml's
# mem_limit for the arithmetic that ties the two together.
<IfModule mpm_prefork_module>
	StartServers            2
	MinSpareServers         2
	MaxSpareServers         4
	MaxRequestWorkers       5
	ServerLimit             5

	# Recycle workers periodically. WordPress plus WooCommerce plus Yoast is a
	# lot of third-party code to trust with a process that lives forever; this
	# bounds any slow leak at a cost of one fork per 500 requests.
	MaxConnectionsPerChild  500
</IfModule>

# Keep-alive is worth having (Caddy holds connections open to the origin) but
# the stock 5-second timeout ties up a worker doing nothing, and there are only
# five of them.
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 100
