# Server identity.

# Silences "Could not reliably determine the server's fully qualified domain
# name" on every start. Apache is not the thing that decides this site's
# hostname -- Caddy terminates TLS and WordPress emits its own URLs from
# wp_options -- so a placeholder is correct here, and putting the real hostname
# in would imply an authority this layer does not have.
ServerName localhost

# The origin is not directly reachable, but there is no reason to advertise the
# exact Apache and PHP build to anything that does get through.
ServerTokens Prod
ServerSignature Off
